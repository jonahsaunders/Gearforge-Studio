name: Desktop regression tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - run: python -m pip install -c constraints-release.txt '.[dev]'
      - run: python scripts/check_version.py
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ runner.os }}-${{ runner.arch }}
          path: build/test-results.xml
