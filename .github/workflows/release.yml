name: Build verified release assets and draft prerelease
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - run: python scripts/check_version.py
      - run: python -m pip install -c constraints-release.txt --upgrade pip
      - run: python -m pip install -c constraints-release.txt '.[dev]' pip-audit
      - run: python -m pip check
      - run: python scripts/verify_bearing_reference.py
      - run: python scripts/verify_fatigue_reference.py
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - run: python -m build
      - run: python scripts/collect_licenses.py
      - run: python -m pip_audit --no-deps --disable-pip -r release-licenses/requirements-runtime.txt --format json --output release-licenses/vulnerability-audit.json
      - run: python -m pip_audit --no-deps --disable-pip -r release-licenses/requirements-runtime.txt --format cyclonedx-json --output release-licenses/sbom.cdx.json
      - run: python scripts/build_native.py
      - run: python scripts/native_archive.py --smoke
      - if: runner.os == 'Windows'
        run: python scripts/build_windows_installer.py
      - if: runner.os == 'Windows'
        run: python scripts/test_windows_installer.py
      - if: runner.os == 'Windows'
        run: python scripts/native_archive.py
      - if: runner.os == 'Linux'
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GearForge-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/test-results.xml
            build/bearing-reference-comparison.json
            build/fatigue-reference-comparison.json
            build/frozen-smoke/desktop-smoke.json
            build/frozen-smoke/*.png
            build/frozen-smoke.log
            build/desktop-worker-result.json
            build/windows-installer-test.json
            release-licenses/DEPENDENCIES.json
            release-licenses/requirements-runtime.txt
            release-licenses/vulnerability-audit.json
            release-licenses/sbom.cdx.json
  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: GearForge-*
          path: assets
          merge-multiple: true
      - name: Verify assets and create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd assets
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          cd ..
          # A maintainer may already have published a separately verified
          # Windows release. Do not replace its binaries or change its visibility.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; verified build assets are retained as workflow artifacts."
            exit 0
          fi
          gh release create "$RELEASE_TAG" assets/* --verify-tag --draft --prerelease --title "GearForge Studio $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
