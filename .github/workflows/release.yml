name: Build verified release assets and draft prerelease
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - run: python scripts/check_version.py
      - run: python -m pip install -c constraints-release.txt --upgrade pip
      - run: python -m pip install -c constraints-release.txt '.[dev]' pip-audit
      - run: python -m pip check
      - run: python scripts/verify_bearing_reference.py
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - run: python -m build
      - run: python scripts/collect_licenses.py
      - run: python -m pip_audit --no-deps --disable-pip -r release-licenses/requirements-runtime.txt --format json --output release-licenses/vulnerability-audit.json
      - run: python -m pip_audit --no-deps --disable-pip -r release-licenses/requirements-runtime.txt --format cyclonedx-json --output release-licenses/sbom.cdx.json
      - run: python scripts/build_native.py
      - run: python scripts/native_archive.py --smoke
      - if: runner.os == 'Linux'
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GearForge-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/test-results.xml
            build/bearing-reference-comparison.json
            build/frozen-smoke/desktop-smoke.json
            build/frozen-smoke/*.png
            build/frozen-smoke.log
            build/desktop-worker-result.json
            release-licenses/DEPENDENCIES.json
            release-licenses/requirements-runtime.txt
            release-licenses/vulnerability-audit.json
            release-licenses/sbom.cdx.json
  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: GearForge-*
          path: assets
          merge-multiple: true
      - name: Verify assets and create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd assets
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          cd ..
          gh release create "$RELEASE_TAG" assets/* --verify-tag --draft --prerelease --title "GearForge Studio $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
