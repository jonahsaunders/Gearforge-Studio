[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gearforge-studio"
version = "1.0.0rc6"
description = "Desktop gearbox synthesis, engineering screening and parametric CAD"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{name = "GearForge Studio contributors"}]
dependencies = ["PySide6-Essentials>=6.11.2,<6.12", "cadquery>=2.8,<2.9", "reportlab>=4.4.9,<5", "numpy>=2.3.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2", "pyinstaller>=6.12"]

[project.scripts]
gearforge = "gearforge.cli:main"

[project.gui-scripts]
gearforge-studio = "gearforge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gearforge = ["data/*.csv", "data/*.json", "data/*.svg", "data/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["cad: real CAD generation and export", "gui: Qt desktop integration"]

[tool.gearforge.release]
macos-build = "6"
