name: Build verified release assets and draft prerelease
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_version.py
      - run: python -m pip install -c constraints-release.txt '.[dev]'
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - run: python -m build
      - run: python scripts/collect_licenses.py
      - run: python -m PyInstaller packaging/gearforge.spec --noconfirm
      - run: python scripts/native_archive.py --smoke
      - if: runner.os == 'Linux'
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: GearForge-${{ runner.os }}-${{ runner.arch }}
          path: release-assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/test-results.xml
            build/frozen-smoke/desktop-smoke.json
            build/frozen-smoke/*.png
  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: GearForge-*
          path: assets
          merge-multiple: true
      - name: Verify assets and create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd assets
          for checksum in *.sha256; do sha256sum --check "$checksum"; done
          cd ..
          gh release create "$RELEASE_TAG" assets/* --verify-tag --draft --prerelease --title "GearForge Studio $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
