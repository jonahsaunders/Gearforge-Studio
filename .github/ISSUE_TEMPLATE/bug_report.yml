name: Bug report
description: Report a reproducible desktop, geometry or simulation problem
body:
  - type: input
    id: version
    attributes:
      label: App version and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Actual behavior and evidence
      description: Include a minimal project or sanitized log. Do not attach private data.
    validations:
      required: true
